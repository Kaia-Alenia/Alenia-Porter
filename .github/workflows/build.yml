name: Build Alenia Porter v6.7

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      verified: ${{ steps.set-verified.outputs.verified }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard pywebview pillow requests imageio

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3

      - name: Copy FFmpeg binaries to package
        run: |
          $ErrorActionPreference = 'Stop'
          mkdir src\alenia_porter\bin
          $ffmpegPath = (Get-Command ffmpeg -CommandType Application).Path
          $ffprobePath = (Get-Command ffprobe -CommandType Application).Path
          Copy-Item $ffmpegPath src\alenia_porter\bin\ffmpeg.exe
          Copy-Item $ffprobePath src\alenia_porter\bin\ffprobe.exe
          Get-ChildItem src\alenia_porter\bin

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build executable with Nuitka
        env:
          PYTHONPATH: src
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --disable-ccache --windows-console-mode=disable --enable-plugin=pywebview --include-package=alenia_porter --include-module=alenia_porter.gui_web --include-module=unicodedata --include-data-dir=src/alenia_porter/assets=alenia_porter/assets --include-data-dir=frontend/dist=frontend/dist --include-data-files=src/alenia_porter/bin/ffmpeg.exe=alenia_porter/bin/ffmpeg.exe --include-data-files=src/alenia_porter/bin/ffprobe.exe=alenia_porter/bin/ffprobe.exe --windows-icon-from-ico=src/alenia_porter/assets/images/logo.ico --output-filename=AleniaPorter.exe porter_launcher.py

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'

      - name: Build Go CLI
        run: |
          go build -o porter_launcher.dist\ap.exe .\cmd\ap

      - name: Smoke test executable
        run: |
          if (Test-Path ALENIA_ERROR.txt) { Remove-Item ALENIA_ERROR.txt }
          & porter_launcher.dist\AleniaPorter.exe --headless
          if ($LASTEXITCODE -ne 0) {
            echo "El ejecutable fallo con codigo de salida $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          if (Test-Path ALENIA_ERROR.txt) {
            echo "Se detectaron errores fatales durante el arranque:"
            Get-Content ALENIA_ERROR.txt
            exit 1
          }

      - name: Package build
        run: |
          copy LICENSE porter_launcher.dist\
          ren porter_launcher.dist AleniaPorter
          7z a AleniaPorter-Windows.zip AleniaPorter\

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AleniaPorter-Windows
          path: AleniaPorter-Windows.zip

      - name: Mark verified
        id: set-verified
        run: |
          if (Test-Path AleniaPorter-Windows.zip) {
            echo "verified=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "verified=false" >> $env:GITHUB_OUTPUT
            exit 1
          }

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      verified: ${{ steps.set-verified.outputs.verified }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard pywebview pillow requests pyobjc pyobjc-framework-WebKit imageio

      - name: Download and extract FFmpeg for macOS
        run: |
          mkdir -p src/alenia_porter/bin
          FFMPEG_URL="https://evermeet.cx/ffmpeg/getrelease/zip"
          FFPROBE_URL="https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip"
          if ! curl -L --fail -o ffmpeg.zip "$FFMPEG_URL"; then
            echo "Error: no se pudo descargar ffmpeg desde $FFMPEG_URL"
            exit 1
          fi
          if ! curl -L --fail -o ffprobe.zip "$FFPROBE_URL"; then
            echo "Error: no se pudo descargar ffprobe desde $FFPROBE_URL"
            exit 1
          fi
          unzip ffmpeg.zip -d src/alenia_porter/bin/
          unzip ffprobe.zip -d src/alenia_porter/bin/
          chmod +x src/alenia_porter/bin/ffmpeg src/alenia_porter/bin/ffprobe
          rm *.zip

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Convert icon for macOS
        run: |
          python -c "
          from PIL import Image
          img = Image.open('src/alenia_porter/assets/images/logo.ico')
          img.save('src/alenia_porter/assets/images/logo.png')
          "

      - name: Build executable with Nuitka
        env:
          PYTHONPATH: src
        run: |
          python -m nuitka --standalone --macos-disable-console --macos-create-app-bundle --enable-plugin=pywebview --macos-app-name=AleniaPorter --include-package=alenia_porter --include-module=alenia_porter.gui_web --include-module=unicodedata --include-data-dir=src/alenia_porter/assets=alenia_porter/assets --include-data-dir=frontend/dist=frontend/dist --include-data-files=src/alenia_porter/bin/ffmpeg=alenia_porter/bin/ffmpeg --include-data-files=src/alenia_porter/bin/ffprobe=alenia_porter/bin/ffprobe --macos-app-icon=src/alenia_porter/assets/images/logo.png --output-filename=AleniaPorter porter_launcher.py
          mkdir -p porter_launcher.dist
          mv *.app porter_launcher.dist/

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'

      - name: Build Go CLI
        run: |
          go build -o porter_launcher.dist/ap ./cmd/ap

      - name: Debug - list dist contents
        run: find porter_launcher.dist -maxdepth 3

      - name: Smoke test executable
        run: |
          rm -f ALENIA_ERROR.txt
          APP_BINARY=$(find porter_launcher.dist -maxdepth 4 -type f -perm -u+x -path "*.app/Contents/MacOS/*" | head -n 1)
          if [ -z "$APP_BINARY" ]; then
            echo "No se encontro el binario dentro del .app bundle"
            find porter_launcher.dist -maxdepth 4
            exit 1
          fi
          echo "Usando binario: $APP_BINARY"
          "$APP_BINARY" --headless
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "El ejecutable fallo con codigo de salida $STATUS"
            exit $STATUS
          fi
          if [ -f ALENIA_ERROR.txt ]; then
            echo "Se detectaron errores fatales durante el arranque:"
            cat ALENIA_ERROR.txt
            exit 1
          fi

      - name: Package build
        run: |
          cp LICENSE porter_launcher.dist/
          mv porter_launcher.dist AleniaPorter
          zip -r AleniaPorter-macOS.zip AleniaPorter

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AleniaPorter-macOS
          path: AleniaPorter-macOS.zip

      - name: Mark verified
        id: set-verified
        run: |
          if [ -f AleniaPorter-macOS.zip ]; then
            echo "verified=true" >> $GITHUB_OUTPUT
          else
            echo "verified=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      verified: ${{ steps.set-verified.outputs.verified }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard pywebview pillow requests imageio
          sudo apt-get update && sudo apt-get install -y xvfb python3-gi python3-gi-cairo gir1.2-webkit2-4.1 libgirepository1.0-dev

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Copy FFmpeg binaries to package
        run: |
          mkdir -p src/alenia_porter/bin
          cp $(which ffmpeg) src/alenia_porter/bin/
          cp $(which ffprobe) src/alenia_porter/bin/

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build executable with Nuitka
        env:
          PYTHONPATH: src
        run: |
          python -m nuitka --standalone --enable-plugin=pywebview --include-package=alenia_porter --include-module=alenia_porter.gui_web --include-module=unicodedata --include-data-dir=src/alenia_porter/assets=alenia_porter/assets --include-data-dir=frontend/dist=frontend/dist --include-data-files=src/alenia_porter/bin/ffmpeg=alenia_porter/bin/ffmpeg --include-data-files=src/alenia_porter/bin/ffprobe=alenia_porter/bin/ffprobe --output-filename=AleniaPorter porter_launcher.py

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'

      - name: Build Go CLI
        run: |
          go build -o porter_launcher.dist/ap ./cmd/ap

      - name: Smoke test executable
        run: |
          rm -f ALENIA_ERROR.txt
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" ./porter_launcher.dist/AleniaPorter --headless
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "El ejecutable fallo con codigo de salida $STATUS"
            exit $STATUS
          fi
          if [ -f ALENIA_ERROR.txt ]; then
            echo "Se detectaron errores fatales durante el arranque:"
            cat ALENIA_ERROR.txt
            exit 1
          fi

      - name: Package build
        run: |
          cp LICENSE porter_launcher.dist/
          mv porter_launcher.dist AleniaPorter
          tar -czf AleniaPorter-Linux.tar.gz AleniaPorter

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AleniaPorter-Linux
          path: AleniaPorter-Linux.tar.gz

      - name: Mark verified
        id: set-verified
        run: |
          if [ -f AleniaPorter-Linux.tar.gz ]; then
            echo "verified=true" >> $GITHUB_OUTPUT
          else
            echo "verified=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  snyk-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@8e119fbb6c251787721d34ba683ed48eba792766 # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  release:
    needs: [build-windows, build-macos, build-linux, snyk-security]
    if: ${{ needs.build-windows.outputs.verified == 'true' && needs.build-macos.outputs.verified == 'true' && needs.build-linux.outputs.verified == 'true' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            artifacts/AleniaPorter-Windows/AleniaPorter-Windows.zip
            artifacts/AleniaPorter-macOS/AleniaPorter-macOS.zip
            artifacts/AleniaPorter-Linux/AleniaPorter-Linux.tar.gz